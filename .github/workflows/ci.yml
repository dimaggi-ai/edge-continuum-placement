name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validation registry (public geography + a seeded synthetic fleet)
        run: python validation.py
      - name: CLI smoke
        run: |
          python -m continuum.cli matrix
          python -m continuum.cli fleet
          python -m continuum.cli physics --rate 400 --km 600
          python -m continuum.cli evaluate -w ran-l1-baseband -t hub
